[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-sharing-doe-analysis"
version = "0.1.0"
description = "DOE-based statistical analysis of the UCI Bike Sharing Dataset"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "matplotlib==3.9.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
