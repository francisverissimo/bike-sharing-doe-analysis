name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up environment
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Reproduce analysis artifacts
        run: make all

      - name: Verify committed artifacts are current
        run: git diff --exit-code
