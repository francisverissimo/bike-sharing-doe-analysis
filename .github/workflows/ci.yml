name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests analysis presentation

      - name: Test
        run: pytest

      - name: Reproduce analysis artifacts
        run: make all

      - name: Verify committed artifacts are current
        run: git diff --exit-code

  paper:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile English SBC paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper

      - name: Compile Brazilian Portuguese SBC paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main-pt-br.tex
          working_directory: paper

      - name: Upload paper PDFs
        uses: actions/upload-artifact@v4
        with:
          name: sbc-papers
          path: |
            paper/main.pdf
            paper/main-pt-br.pdf
